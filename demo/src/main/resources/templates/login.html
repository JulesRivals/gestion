<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SubPilot</title>
    <link rel="stylesheet" th:href="@{/css/accueil.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<header class="navbar-minimal">
    <a th:href="@{/}" class="logo-minimal">SubPilot</a>
    <a th:href="@{/}" class="btn-glow">← Retour à l'accueil</a>
</header>

<div class="login-container-centered">
    <div class="form-box-centered">
        <h1>Se connecter</h1>
        <p class="form-subtitle">Accédez à votre compte SubPilot</p>

        <!-- FORMULAIRE CORRECT : méthode POST et champs name présents -->
        <form th:action="@{/login}" method="post" id="login-form">
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="vous@example.com"
                    required
                    aria-label="Adresse e-mail"
                >
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                    aria-label="Mot de passe"
                >
            </div>

			<p id="error-msg"
			   class="error-message"
			   th:if="${error}"
			   th:text="${error}"
			   th:classappend="${error} ? ' show' : ''"></p>

            <!-- Bouton démarre disabled mais sera activé par login.js -->
            <button id="login-btn" type="submit" disabled class="btn-login">
                Se connecter
            </button>
        </form>

        <div class="signup-link">
            <p>Vous n'avez pas encore de compte ?
                <a th:href="@{/register}">Créez-en un ici</a>
            </p>
        </div>

        <div class="forgot-password">
            <a href="/">Mot de passe oublié ?</a>
        </div>

        <div class="trust-badges">
            <span class="badge">🔒 Sécurisé SSL</span>
            <span class="badge">✓ Données chiffrées</span>
            <span class="badge">RGPD Conforme</span>
        </div>
    </div>
</div>

<footer class="footer">
    <!-- ... ton footer existant ... -->
</footer>

<!-- Charger le script séparément, après le DOM -->
<script th:src="@{/js/login.js}"></script>
</body>
</html>
